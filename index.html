<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SAAE — Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-top">
      <div class="logo">
        <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
          <path d="M24 3C24 3 8 21.5 8 31a16 16 0 0 0 32 0C40 21.5 24 3 24 3Z" fill="#ffffff"/>
          <path d="M14 33c2.5 3 6 4.5 9.5 4.2" stroke="#0a2c5e" stroke-width="2.6" stroke-linecap="round" fill="none"/>
          <path d="M18 26.5c2 2.4 4.6 3.6 7.2 3.4" stroke="#0a2c5e" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="header-actions">
        <button class="icon-btn plain" aria-label="Notificações" data-action="soon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="Perfil" onclick="window.location.href='conta.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="greeting">
      <h1>Olá, João!</h1>
      <p id="greeting-sub">Boa tarde!</p>
    </div>
  </header>

  <!-- ===== CONTA ATUAL ===== -->
  <section class="account-card">
    <div class="card-head">
      <div class="doc-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M16 13H8M16 17H8M10 9H8"/>
        </svg>
      </div>
      <div>
        <h2>Sua conta atual</h2>
        <span>Setembro 2025</span>
      </div>
    </div>

    <div class="amount">R$ 64,80</div>

    <span class="pill" data-due="2025-09-30">Vence em 18 dias</span>

    <button class="btn-primary" onclick="window.location.href='conta.html'">
      Pagar conta
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
  </section>

  <!-- ===== SERVIÇOS RÁPIDOS ===== -->
  <section class="section">
    <h3>Serviços rápidos</h3>
    <div class="services-grid">

      <a class="service-tile" href="conta.html">
        <span class="s-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="#0a2c5e"/>
            <path d="M14 2v6h6" stroke="#fff"/>
            <path d="M16 13H8M16 17H8" stroke="#fff"/>
          </svg>
        </span>
        <span>2ª via<br>de conta</span>
      </a>

      <a class="service-tile" href="#" data-action="soon">
        <span class="s-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C12 2 5 10.2 5 15a7 7 0 0 0 14 0C19 10.2 12 2 12 2Z" fill="#0a2c5e"/>
            <path d="M9.2 15.6a3.2 3.2 0 0 0 2.6 3" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          </svg>
        </span>
        <span>Falta de<br>água</span>
      </a>

      <a class="service-tile" href="#" data-action="soon">
        <span class="s-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </span>
        <span>Solicitar<br>serviço</span>
      </a>

      <a class="service-tile" href="#" data-action="soon">
        <span class="s-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0a2c5e" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            <path d="M9 3 6.5 5.5M5.5 6.5 3 9" opacity=".55"/>
          </svg>
        </span>
        <span>Falta de<br>conta</span>
      </a>

      <a class="service-tile" href="#" data-action="soon">
        <span class="s-icon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="12" width="4.5" height="8" rx="1" fill="#0a2c5e"/>
            <rect x="9.75" y="8" width="4.5" height="12" rx="1" fill="#0a2c5e"/>
            <rect x="16.5" y="4" width="4.5" height="16" rx="1" fill="#0a2c5e"/>
          </svg>
        </span>
        <span>Meu<br>consumo</span>
      </a>

    </div>
  </section>

  <!-- ===== AVISO ===== -->
  <div class="notice-banner" data-action="soon">
    <span class="n-icon">
      <svg viewBox="0 0 24 24">
        <path d="M3 10v4a1 1 0 0 0 1 1h2l3.5 5a1 1 0 0 0 1.7-.75V5.75A1 1 0 0 0 9.5 5L6 10H4a1 1 0 0 0-1 1z" fill="#0a2c5e"/>
        <path d="M15.5 8.5a4.5 4.5 0 0 1 0 7M18 6a8 8 0 0 1 0 12" stroke="#0a2c5e" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </svg>
    </span>
    <div class="n-text">
      <strong>Avisos na sua região</strong>
      <p>Manutenção programada no bairro Centro hoje, das 14h às 17h.</p>
    </div>
    <span class="n-arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </span>
  </div>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottom-nav">
    <a href="index.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>
      </svg>
      Início
      <span class="nav-indicator"></span>
    </a>
    <a href="conta.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6M16 13H8M16 17H8"/>
      </svg>
      Contas
      <span class="nav-indicator"></span>
    </a>
    <a href="#" data-action="soon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      Serviços
      <span class="nav-indicator"></span>
    </a>
    <a href="#" data-action="soon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
      </svg>
      Avisos
      <span class="nav-indicator"></span>
    </a>
    <a href="#" data-action="soon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      Perfil
      <span class="nav-indicator"></span>
    </a>
  </nav>

</div>
<script src="script.js"></script>
</body>
</html>
