<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SAAE — Conta de água</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ===== TOP BAR ===== -->
  <header class="topbar">
    <button class="back-btn" aria-label="Voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <h1>Conta de água</h1>
  </header>

  <!-- ===== DETALHE DA CONTA ===== -->
  <section class="detail-card">
    <div class="detail-head">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C12 2 5 10.2 5 15a7 7 0 0 0 14 0C19 10.2 12 2 12 2Z"/>
        <path d="M9.2 15.6a3.2 3.2 0 0 0 2.6 3" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      </svg>
      <h2>Setembro 2025</h2>
    </div>

    <div class="detail-amount">R$ 64,80</div>

    <span class="pill" data-due="2025-09-30">Vence em 18 dias</span>

    <div class="info-row">
      <span class="label">Código do cliente</span>
      <span class="value">123456</span>
    </div>
    <div class="info-row">
      <span class="label">Matrícula</span>
      <span class="value">987654</span>
    </div>
    <div class="address">
      <span class="label">Endereço</span>
      <p>Rua das Mangueiras, 123<br>Centro - São Sebastião do Uatumã/AM</p>
    </div>
  </section>

  <!-- ===== PAGAR ===== -->
  <div class="detail-actions">
    <button class="btn-primary" data-action="pay">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2.5"/>
        <path d="M2 10h20"/>
        <path d="M6 15h4"/>
      </svg>
      Pagar conta
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
  </div>

  <!-- ===== MENU ===== -->
  <div class="menu-list">

    <a class="menu-item" href="#" data-action="soon">
      <span class="m-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6M16 13H8M16 17H8"/>
        </svg>
      </span>
      <span>Emitir 2ª via</span>
      <span class="m-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </span>
    </a>

    <a class="menu-item" href="#" data-action="soon">
      <span class="m-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2.5"/>
          <path d="M8 3v4M16 3v4M3 10h18"/>
          <path d="M9.5 15.5 11 17l2.5-3" stroke-width="1.6"/>
        </svg>
      </span>
      <span>Ver histórico de contas</span>
      <span class="m-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </span>
    </a>

    <a class="menu-item" href="#" data-action="soon">
      <span class="m-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 16v-4M12 8h.01"/>
        </svg>
      </span>
      <span>Ver detalhes da conta</span>
      <span class="m-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </span>
    </a>

  </div>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottom-nav">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>
      </svg>
      Início
      <span class="nav-indicator"></span>
    </a>
    <a href="conta.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6M16 13H8M16 17H8"/>
      </svg>
      Contas
      <span class="nav-indicator"></span>
    </a>
    <a href="#" data-action="soon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      Serviços
      <span class="nav-indicator"></span>
    </a>
    <a href="#" data-action="soon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
      </svg>
      Avisos
      <span class="nav-indicator"></span>
    </a>
    <a href="#" data-action="soon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      Perfil
      <span class="nav-indicator"></span>
    </a>
  </nav>

</div>
<script src="script.js"></script>
</body>
</html>
